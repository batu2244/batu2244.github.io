{% capture currentYear %}{{ 'now' | date: '%Y' }}{% endcapture %}

<footer class="relative pt-24 pb-6">
  <div class="container mx-auto px-4">
    <div class="flex flex-wrap text-left lg:text-left">
      <div class="w-full lg:w-6/12 px-4">
        {% include social.html %}
      </div>
    </div>
    <div class="text-left text-sm text-gray-500 dark:text-slate-400 font-light pt-2 space-y-1 px-4">
      <p>Made with ☕ by Batuhan Aydin</p>
      {%- if page.layout == 'home' %}
      <p id="visit-counter" style="align-items: center; gap: 0.375rem;" title="Site visits" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>
        <span id="visit-counter-text"></span>
      </p>
      {%- endif %}
    </div>
  </div>
</footer>

{%- if page.layout == 'home' %}
<script>
  // Visit counter via Abacus (abacus.jasoncameron.dev). Counts once per browser session;
  // reloads in the same session only read the current total.
  (function () {
    var el = document.getElementById('visit-counter');
    var text = document.getElementById('visit-counter-text');
    var base = 'https://abacus.jasoncameron.dev';
    var key = 'batu2244-github-io/home';
    var counted = false;
    try { counted = sessionStorage.getItem('visit-counted') === '1'; } catch (e) {}
    // Local previews only read the total so they don't inflate it
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) counted = true;
    fetch(base + (counted ? '/get/' : '/hit/') + key)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var n = typeof d.value === 'number' ? d.value : (d.error === 'Key not found' ? 0 : null);
        if (n === null) return;
        try { sessionStorage.setItem('visit-counted', '1'); } catch (e) {}
        text.textContent = n.toLocaleString() + (n === 1 ? ' visit' : ' visits');
        el.hidden = false;
        el.style.display = 'flex';
      })
      .catch(function () {});
  })();
</script>
{%- endif %}
