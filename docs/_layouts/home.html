---
layout: base
---
<div class="home">
  <section class="home-intro">
    {%- if page.headshot %}
    <img class="home-intro__photo" src="{{ page.headshot | relative_url }}" alt="{{ site.title }}">
    {%- endif %}
    <article class="home-intro__text text-left prose prose-p:font-extralight prose-slate dark:prose-invert primary-underline">
      {{ content }}
    </article>
  </section>

  {% include project-cards.html %}
</div>

<style>
  /* One content width for every section on the home page */
  .home {
    max-width: 60rem;
    margin: 0 auto;
    padding-block: 2rem 1rem;
  }
  .home-intro {
    display: grid;
    grid-template-columns: 15rem minmax(0, 1fr);
    gap: 2.5rem;
    align-items: stretch;
  }
  /* Photo matches the height of the intro text beside it */
  .home-intro__photo {
    width: 100%;
    height: 100%;
    min-height: 18rem;
    object-fit: cover;
    object-position: center 60%;
  }
  .home-intro__text.prose { max-width: none; }
  .home-intro__text > :first-child { margin-top: 0; }
  .home-intro__text > :last-child { margin-bottom: 0; }

  @media (max-width: 768px) {
    .home-intro { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
    .home-intro__photo { width: 15rem; max-width: 100%; height: auto; min-height: 0; aspect-ratio: 3 / 4; margin: 0 auto; }
  }
</style>
