# Cards shown on the main page.
# group: projects or work
# context: optional label pill
# media: optional pictures/videos shown in one row above the text, each at its own shape
#   src, alt, ratio (width / height); videos also take type: video and poster
# embed / embed_title: optional live site shown inside the card
projects:
  - name: M3X - Mind, Machine and Motor Nexus (NSF)
    group: projects
    media:
      - src: /assets/images/project_m3x.jpg
        alt: The M3X testbed, a row of workstations with movable fabric partitions and light strips in front of large windows
        ratio: 1.3333
      - src: /assets/images/project_m3x_partitions.mp4
        type: video
        poster: /assets/images/project_m3x_partitions_poster.jpg
        alt: Video of the M3X partitions moving into place, controlled from a tablet dashboard
        ratio: 0.5625
      - src: /assets/images/project_ring.jpg
        alt: A 3D-printed USC ring with embedded electronics, worn on a finger
        ratio: 0.6931
    summary: "Can a room respond to how you feel? M3X tests whether adjusting light, partitions, and sound in real time, based on signals from a wearable, can reduce stress at work. The goal is a system that learns which changes help each person, rather than applying the same fix to everyone."
  - name: Smart and Connected Health
    group: projects
    media:
      - src: /assets/images/project_sch.jpg
        alt: A rugged Android phone running the study's data-recording app, showing that decoding is on and the latest 20-second file was saved
        ratio: 0.75
    summary: "A long-term observational study that tracks activity, sleep, and daily rhythms through wearables to understand how everyday behavior shapes health and wellbeing. I build and run the backend that collects and stores that data, so it stays clean and continuous enough to catch patterns over months, not just days."
  - name: Lighting-Timing
    group: projects
    media:
      - src: /assets/images/project_lighting_room.jpg
        alt: The study room, an office with a desk, chairs and the adjustable ceiling light panel used for the lighting scenes
        ratio: 1.3293
      - src: /assets/images/project_lighting_timing.jpg
        alt: Study design showing rest, arithmetic and recovery phases, with bright-cool and dim-warm lighting scenes turning on at randomly shifted times
        ratio: 2
    summary: "This lab study looks at when adaptive lighting should step in during stress, not just which light helps. Participants did a timed math stress test while wearing a wristband that recorded their body's stress responses. Bright, cool or dim, warm light turned on at randomly shifted times. I built the Python pipeline, from wristband signal cleaning to mixed-effects models of physiological and self-reported stress."
  - name: Dr. Milou - petdentalcheckup.com
    group: work
    summary: "Most pet dental disease goes unnoticed until it's painful and expensive. Dr. Milou lets owners photograph their pet's teeth and get an AI assessment in seconds. The goal is to catch problems early and get owners to act - without alarming them or replacing the vet."
    embed: https://petdentalcheckup.com/
    embed_title: Dr. Milou - AI pet dental checkup
